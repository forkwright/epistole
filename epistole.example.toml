# Example epistole config. Copy to epistole.toml and fill in.
#
# Production deployments should keep secrets in /etc/epistole.env
# (0600 root:root) and reference them here as ${VAR} placeholders,
# which Config::load resolves at startup. Never commit a real config.
#
# Key order matters: TOML assigns every key after a [table] header to
# that table, so the root-level keys below must stay above [brand] and
# [smtp]. Moving token_secret or send_auth_token under [smtp] makes the
# file fail to load with `unknown field`.

# Listen address. Caddy / Traefik should reverse-proxy from
# letters.<consumer-domain> to this bind. Keep in step with
# deploy/Caddyfile.snippet and DEPLOY.md's proxy table.
bind = "127.0.0.1:9090"

# fjall database directory. One process per directory.
data_dir = "/var/lib/epistole/data"

# Public URL — used to build confirm + unsubscribe links in outbound mail.
base_url = "https://letters.example.com"

# HMAC secret for signing confirm/unsubscribe tokens. 32 bytes of
# entropy minimum. Generate with: head -c 32 /dev/urandom | base64
token_secret = "REPLACE_WITH_BASE64_RANDOM_32"

# Bearer token required for POST /send. Operator-only.
# Generate with: head -c 24 /dev/urandom | base64
send_auth_token = "REPLACE_WITH_BASE64_RANDOM_24"

# Bearer token the SMTP relay's bounce/complaint webhook must present.
# Distinct from send_auth_token - a leaked webhook secret must not also
# authorize triggering a send. Generate with: head -c 24 /dev/urandom | base64
webhook_auth_token = "REPLACE_WITH_BASE64_RANDOM_24_WEBHOOK"

# Recipient-delivery caps enforced by POST /send, rolling UTC windows.
# Not secrets - tune to the relay plan's rate limit and list size.
send_cap_per_hour = 500
send_cap_per_day = 2000

# Reverse-proxy peer(s) X-Forwarded-For is honored from, checked
# against the connecting TCP peer — never the header content itself.
# Each entry is a single address ("127.0.0.1") or a CIDR range
# ("10.0.0.0/24") for a proxy pool that doesn't present one stable
# address (e.g. behind a load balancer). 127.0.0.1 matches NPM on the
# same box (DEPLOY.md step 8a); if NPM runs on a different host, use
# its LAN address (or its subnet, if it isn't pinned to one address)
# here instead. Empty or omitted means every visitor behind an
# unconfigured proxy collapses onto one rate-limit bucket (safe, but
# not what you want) — see TrustedProxyExtractor in src/lib.rs.
trusted_proxies = ["127.0.0.1"]

# Brand identity for outbound mail.
[brand]
name = "Example Brand"
from_address = "letters@example.com"
reply_to = "contact@example.com"

# SMTP relay (Postmark / Mailgun / etc.). Outbound IP needs SPF / DKIM /
# DMARC records on whichever domain the from_address belongs to. Both
# username and password are credentials (for Postmark they're the SAME
# API token) - treat both as secrets, never paste real values here.
[smtp]
host = "smtp.postmarkapp.com"
port = 587
username = "REPLACE_WITH_POSTMARK_TOKEN"
password = "REPLACE_WITH_POSTMARK_TOKEN"
