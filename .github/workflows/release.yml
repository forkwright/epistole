name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # WHY(#70): assets are append-once. Any asset already published under
  # this tag means release.yml already ran for it, so a further run is a
  # republish attempt and must fail before the build matrix spends any
  # compute on a run that can only end in a collision. Corrections ship
  # as a new tag, never a same-tag rerun.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Refuse to republish an existing release
        run: bash .github/scripts/release-preflight.sh "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Test
        # WHY --locked: fail on Cargo.lock drift instead of silently
        # resolving different dependency versions than the committed
        # lockfile, which would make the release build inputs unreproducible.
        run: cargo test --workspace --locked

  build:
    needs: [preflight, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: epistole-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: epistole-linux-arm64
            cross: true
    runs-on: ${{ matrix.os }}
    env:
      # WHY(#70): the exact cross release this job installs and, via
      # cross's own version-matched image tag, the build container
      # (digest-pinned in Cross.toml) it cross-compiles inside.
      CROSS_VERSION: "0.2.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version "${CROSS_VERSION}" --locked
      - name: Build native
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build cross
        if: ${{ matrix.cross }}
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/epistole ${{ matrix.artifact }}
      - name: Generate checksum
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - name: Verify checksum against the immutable artifact
        run: sha256sum -c ${{ matrix.artifact }}.sha256

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: ${{ matrix.artifact }}.cdx.json
          format: cyclonedx-json
          output-file: ${{ matrix.artifact }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Attest CycloneDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ matrix.artifact }}
          sbom-path: ${{ matrix.artifact }}.cdx.json

      # WHY(#70) this is the LAST step: the binary, checksum, and SBOM are
      # generated and the checksum verified above before anything is
      # published, and both attestations are recorded against the local
      # artifact's own digest before it is uploaded anywhere. Publication
      # goes through release-upload.sh, which passes gh no overwrite flag --
      # an asset-name collision on this tag is a hard error, not a silent
      # replace, and it is the only call site that uploads a release asset
      # (see tests/release_contract.rs).
      - name: Publish binary, checksum, and SBOM
        run: |
          bash .github/scripts/release-upload.sh "${{ needs.preflight.outputs.tag }}" \
            ${{ matrix.artifact }} \
            ${{ matrix.artifact }}.sha256 \
            ${{ matrix.artifact }}.cdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
