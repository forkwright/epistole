name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-please:
    uses: forkwright/.github/.github/workflows/release-please.yml@main
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # WHY: this workflow never builds a binary (release.yml does, on the
  # tag push release-please creates), so there is nothing here for
  # actions/attest-build-provenance to attest against a build artifact.
  # Attesting the tagged source tree itself — same pattern as kanon's
  # own release-please.yml — still gives consumers a verifiable,
  # Rekor-logged claim about exactly which source a release tag points
  # to, and satisfies CI/release-yml-missing-attestation without a
  # redundant second build pipeline.
  attest-release-source:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Stage source archive
        id: source
        run: |
          archive="epistole-${{ needs.release-please.outputs.tag_name }}.tar.gz"
          git archive --format=tar.gz --output "$archive" HEAD
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: ${{ steps.source.outputs.archive }}.cdx.json
          format: cyclonedx-json
          output-file: ${{ steps.source.outputs.archive }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest source provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.source.outputs.archive }}

      - name: Attest CycloneDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.source.outputs.archive }}
          sbom-path: ${{ steps.source.outputs.archive }}.cdx.json
