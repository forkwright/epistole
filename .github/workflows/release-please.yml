name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # WHY: this workflow never builds a binary (release.yml does, on the
  # tag push release-please creates), so there is nothing here for
  # actions/attest-build-provenance to attest against a build artifact.
  # Attesting the tagged source tree itself — same pattern as kanon's
  # own release-please.yml — still gives consumers a verifiable,
  # Rekor-logged claim about exactly which source a release tag points
  # to, and satisfies CI/release-yml-missing-attestation without a
  # redundant second build pipeline.
  attest-release-source:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Stage source archive
        id: source
        run: |
          archive="epistole-${{ needs.release-please.outputs.tag_name }}.tar.gz"
          git archive --format=tar.gz --output "$archive" HEAD
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0
        with:
          artifact-name: ${{ steps.source.outputs.archive }}.cdx.json
          format: cyclonedx-json
          output-file: ${{ steps.source.outputs.archive }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest source provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.source.outputs.archive }}

      - name: Attest CycloneDX SBOM
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1
        with:
          subject-path: ${{ steps.source.outputs.archive }}
          sbom-path: ${{ steps.source.outputs.archive }}.cdx.json
