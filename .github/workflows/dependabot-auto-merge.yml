# WHY a caller rather than a local copy: this logic guards auto-merge, and a
# copy is how this repo's version drifted from the fixed one -- the vendored
# step snapshotted `gh pr checks` once via `--watch --required`, so a check
# that had not yet reported when the watch returned was invisible to the
# per-check loop that ran right after it, and a dependabot PR whose real CI
# was still green showed a failed `auto-merge` job (epistole#125). The
# reusable instead polls until every required check GROUP reaches a terminal
# state before judging it. One implementation, one place to fix.
name: Dependabot Auto-Merge

on:
  pull_request:

# WHY declared here as well as in the reusable: a called workflow's permissions
# can only narrow what the caller grants, never widen it. Stating them at the
# caller keeps the ceiling visible in the repo that owns the risk rather than
# only in another repository's file.
permissions:
  contents: write
  pull-requests: write

# WHY a caller-level concurrency block: the reusable declares none of its own
# for this workflow (unlike hybrid-gate.yml, which does, and would self-cancel
# against a caller-level duplicate). Without this block, a superseded push to
# a dependabot PR leaves its earlier run racing the newer one -- both waiting
# on checks, both able to merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: the vendored copy this replaces also refused auto-merge whenever this
# repo's own `kanon-lint` job (see ci.yml) reported "fail". The fleet reusable
# takes no inputs (`on: workflow_call: {}`) and has no way to know about a
# repo-local check by that name, so that behavior is dropped, not carried
# forward. It drops no live protection today: kanon-lint is not one of main's
# required-status-checks and, with FLEET_REPO_TOKEN absent from hosted
# runners, its job-level `if` always reports SKIPPED, never FAIL (see ci.yml's
# WHY block). If FLEET_REPO_TOKEN is ever provisioned and kanon-lint starts
# genuinely running, add it to main's required-status-checks so branch
# protection blocks the merge upstream of this workflow -- don't re-vendor
# this file to get a local check back.
jobs:
  auto-merge:
    # WHY @main, not a pinned SHA: forkwright/.github publishes no tags, so
    # dependabot has no version to compare a SHA against and would never bump
    # one -- a pin that looks maintained but silently never moves. Fleet
    # convention: triggers + permissions + inputs live in the caller, logic is
    # delegated, callers pin @main.
    #
    # WHY no `secrets: inherit`, when gate-attestation.yml does inherit: that
    # keyword forwards EVERY repository secret to a workflow in another
    # repository, and this one reads `secrets.GITHUB_TOKEN` and nothing else --
    # which a called workflow receives regardless. Inheriting here would widen
    # the blast radius of a change to forkwright/.github for no capability.
    uses: forkwright/.github/.github/workflows/dependabot-auto-merge.yml@main
