# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false

[advisories]
# WHY: keep in sync with .cargo/audit.toml's [advisories.ignore] array.
# cargo-audit does not read deny.toml, so any ignore lives in both files.
yanked = "deny"
ignore = []

[licenses]
# WHY: epistole is AGPL-3.0-or-later (declared in Cargo.toml). Allow list
# covers permissive licenses used by transitive deps; revisit on any
# license addition flagged by cargo-deny.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
