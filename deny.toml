# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false

[advisories]
# WHY: keep in sync with .cargo/audit.toml's [advisories.ignore] array.
# cargo-audit does not read deny.toml, so any ignore lives in both files.
yanked = "deny"
ignore = [
    # WHY: lettre 0.11.21 TLS hostname verification bypass affects only
    # the `boring-tls` feature (advisory: "Other TLS backends
    # (`native-tls`, `rustls`) are unaffected."). epistole's Cargo.toml
    # pins lettre with `default-features = false` + explicit
    # `tokio1-rustls`, `ring`, `webpki-roots` features — `boring-tls` is
    # never enabled, so the inverted-boolean code path is unreachable.
    # Drop this ignore on next `lettre` bump to >=0.11.22.
    # Dep chain: lettre 0.11.21 -> epistole 0.0.1 (direct dep).
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0141
    "RUSTSEC-2026-0141",
]

[licenses]
# WHY: epistole is AGPL-3.0-or-later (declared in Cargo.toml). Allow list
# covers permissive licenses used by transitive deps; revisit on any
# license addition flagged by cargo-deny.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
