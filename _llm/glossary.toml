[meta]
name = "epistole"
repo = "forkwright/epistole"
generated = false
source_docs = [
  "README.md",
  "src/store.rs",
  "src/token.rs",
]

[glossary]
description = "Domain vocabulary for the epistole newsletter service."

[[terms]]
term = "epistole"
definition = "Letter sent; the fleet newsletter service."
canonical = true

[[terms]]
term = "subscriber"
definition = "Email address record with Pending, Active, or Unsubscribed state."
canonical = true

[[terms]]
term = "confirm token"
definition = "Signed link token that creates or confirms an Active subscriber."
canonical = true

[[terms]]
term = "unsubscribe token"
definition = "Signed link token that flips an Active subscriber to Unsubscribed."
canonical = true

[[terms]]
term = "consent generation"
definition = "Monotonic counter on a subscriber row, bumped on a successful unsubscribe. A confirm or unsubscribe token carries the generation read at mint time; a handler honors the token only while it still matches, which distinguishes a token minted before a later consent event from one minted after it."
canonical = true

[[terms]]
term = "one-click unsubscribe"
definition = "The RFC 8058 List-Unsubscribe-Post contract: a mail client POSTs directly to a dedicated endpoint with a fixed body, no interstitial, distinct from the manual browser-driven unsubscribe flow."
canonical = true

[[terms]]
term = "send"
definition = "Operator-authored newsletter issue persisted before delivery."
canonical = true

[[terms]]
term = "send_id"
definition = "Caller-supplied ULID identifying one POST /send call. Not minted server-side - it is the idempotency key: retrying the same send_id resumes a partial fan-out (skips recipients that already have a Delivery row) instead of re-sending everyone."
canonical = true

[[terms]]
term = "delivery"
definition = "Per-recipient outcome row keyed <send_id>/<email>: Queued, Sent, Failed, Bounced, or Complained, with a timestamp and optional error. The ledger POST /send writes to and POST /webhooks/delivery-events updates in place."
canonical = true

[[terms]]
term = "send cap"
definition = "The hourly and daily ceiling on recipient deliveries POST /send will attempt, tracked as rolling UTC-window counters. A recipient not admitted under the cap is deferred, not dropped - retrying the same send_id later resumes them."
canonical = true

[[terms]]
term = "suppression"
definition = "Flipping an Active subscriber to Unsubscribed (with a consent-generation bump) in response to a spam complaint or a hard bounce reported via POST /webhooks/delivery-events - the same state transition a visitor's own unsubscribe click produces, triggered by a relay-authenticated system event instead."
canonical = true
