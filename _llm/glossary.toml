[[terms]]
term = "confirm token"
definition = "Signed link token that creates or confirms an Active subscriber."
canonical = true

[[terms]]
term = "unsubscribe token"
definition = "Signed link token that flips an Active subscriber to Unsubscribed."
canonical = true

[[terms]]
