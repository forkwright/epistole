# epistole exposes no MCP server; empty array satisfies schema.
mcp_tools = []

[meta]
name = "epistole"
repo = "forkwright/epistole"
generated = false
source_docs = [
  "README.md",
  "src/lib.rs",
  "src/main.rs",
]

[apis]
summary = "Epistole exposes one service binary and a small HTTP surface for newsletter subscription and sends."

[[cli_commands]]
name = "epistole"
purpose = "Run the newsletter HTTP service from the configured bind address."

[[http_routes]]
method = "GET"
path = "/healthz"
purpose = "Health check."

[[http_routes]]
method = "POST"
path = "/subscribe"
purpose = "Validate a subscription request and send a stateless confirmation."

[[http_routes]]
method = "GET"
path = "/confirm"
purpose = "Preview a confirm token's outcome without mutating (RFC 9110 safe-method)."

[[http_routes]]
method = "POST"
path = "/confirm"
purpose = "Commit a confirm token and activate a subscriber."

[[http_routes]]
method = "GET"
path = "/unsubscribe"
purpose = "Preview an unsubscribe token's outcome without mutating (RFC 9110 safe-method)."

[[http_routes]]
method = "POST"
path = "/unsubscribe"
purpose = "Commit an unsubscribe token and mark a subscriber unsubscribed."

[[http_routes]]
method = "POST"
path = "/unsubscribe/one-click"
purpose = "RFC 8058 List-Unsubscribe-Post: one-click unsubscribe for mail clients, no interstitial."

[[http_routes]]
method = "GET"
path = "/archive"
purpose = "Render public newsletter archive."

[[http_routes]]
method = "POST"
path = "/send"
purpose = "Auth-gated operator send endpoint. send_id is caller-supplied (the idempotency key, not minted server-side); mints a per-recipient unsubscribe token, delivers via the SMTP relay, records one Delivery ledger row per recipient, enforces the hourly/daily send caps."

[[http_routes]]
method = "POST"
path = "/webhooks/delivery-events"
purpose = "Bearer-gated bounce/complaint ingestion, authenticated by its own webhook_auth_token (distinct from send_auth_token). Updates the delivery ledger; a complaint or hard bounce suppresses the subscriber (Active -> Unsubscribed)."
