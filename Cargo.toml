[package]
name = "epistole"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/forkwright/epistole"
rust-version = "1.94"
description = "Sovereign newsletter service for fleet web properties - axum + fjall + maud + lettre."

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"

# Persistence (single-writer per keyspace; matches fleet pattern)
fjall = "3"

# Per-IP rate limiting (governor algorithm — token bucket, lock-free)
tower_governor = "0.8"

# Constant-time byte comparison for bearer-token auth (defends against
# timing oracles on /send)
subtle = "2"

# HTML sanitization for the Phase 2 archive page — strips javascript:/
# data: URLs from markdown-rendered links. ammonia uses an allowlist
# approach so any future tag/attr surface stays closed by default.
ammonia = "4"

# Lexicographic, monotonic, time-prefixed identifier for Send records.
# Replaces wall-clock-nanosecond send_ids that collided on same-ns sends.
ulid = "1"

# HTML rendering (compile-time templates, type-safe, zero runtime deps)
maud = { version = "0.27", features = ["axum"] }

# Serde + JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
# RUSTSEC-2026-0009: time pre-0.3.47 is vulnerable to stack-exhaustion
# DoS in the RFC 2822 parser. Pinning >=0.3.47 closes that even though
# epistole only emits time strings, never parses untrusted ones.
time = { version = "0.3.47", features = ["serde", "macros"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors
snafu = "0.9"

# Tokens (URL-safe, time-limited, HMAC-signed)
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
rand = "0.9"

# Secret handling (zeroize on drop, no Debug/Display leakage)
secrecy = { version = "0.10", features = ["serde"] }

# Email validation
email_address = "0.2"

# Config
toml = "1.1"
clap = { version = "4", features = ["derive"] }

[dependencies.tower-http]
version = "0.6"
features = ["trace", "limit", "cors", "timeout"]

[dependencies.lettre]
version = "0.11"
default-features = false
features = ["smtp-transport", "tokio1-rustls", "ring", "webpki-roots", "builder", "tracing"]

[dependencies.pulldown-cmark]
version = "0.13"
default-features = false
features = ["html"]

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Deny-level
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
unwrap_used = "deny"
expect_used = "deny"

# Correctness
await_holding_lock = "deny"

# Architectural boundary enforcement
disallowed_methods = "deny"
disallowed_types = "deny"
