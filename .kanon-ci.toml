# archetype: B
# forge-only: false
# spdx: LicenseRef-PolyForm-Noncommercial-1.0.0

# Forge CI pipeline for forkwright/epistole.
#
# Mirrors the fleet-default Rust gate (fmt → check → clippy → nextest →
# lint). Build and test concurrency is pinned to 8 because a run is not
# guaranteed to have the executor to itself. Unpinned, cargo and nextest
# size their parallelism to the whole machine, so every run that happens
# to be in flight at the same time claims all of it, and it is their
# combined footprint rather than any single run's that exhausts memory.
# Raise or remove the pin only where runs are serialized or each run gets
# an executor of its own. Keep in sync with hamma / dictyon / harmonia
# until the workspace grows.

[pipeline]
stages = ["cargo fmt", "cargo check", "cargo clippy", "cargo nextest", "kanon lint", "cargo-audit", "cargo-deny"]

[stages."cargo fmt"]
cmd = "cargo fmt --all -- --check"
timeout_secs = 300

[stages."cargo check"]
cmd = "cargo check --all-targets --jobs 8"
timeout_secs = 900

[stages."cargo clippy"]
cmd = "cargo clippy --all-targets --jobs 8 -- -D warnings"
timeout_secs = 900

[stages."cargo nextest"]
cmd = "cargo nextest run --build-jobs 8 --test-threads 8"
timeout_secs = 1800

[stages."kanon lint"]
cmd = "kanon lint . --summary"
timeout_secs = 600
